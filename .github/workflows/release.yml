name: release

# Analysis-Tool 自建发版（无 semantic-release）：
#   - push 到 main     -> beta（VERSION 文件 + BUILD+1，不发 GitHub Release）
#   - push tag X.Y.Z.0 -> stable（取 tag，发 GitHub Release 并设 latest）
on:
  push:
    branches: [main]
    tags: ['*.*.*.0']
    # 只改文档 / 发版基础设施（VERSION、ci/、.github/、scripts/）不发 beta：
    # GitHub 只在「本次推送的所有改动文件都命中 patterns」时跳过；夹带代码改动照常发版。
    # tag 推送不受 paths-ignore 影响，stable 始终发布。
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - 'ci/**'
      - '.github/**'
      - 'scripts/**'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide release kind (VERSION bump)
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 ci/release.py decide --before "$BEFORE"

      - name: Determine channel and version
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            CHANNEL=stable; TAG="$GITHUB_REF_NAME"
          elif [ "${IS_RELEASE:-0}" = "1" ]; then
            CHANNEL=stable; TAG="$RELEASE_TAG"
          else
            CHANNEL=beta; TAG=""
          fi
          echo "channel=$CHANNEL tag=$TAG"
          python3 ci/release.py version --channel "$CHANNEL" --tag "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # 干净源码副本供打包（release.py pack 从 ./repo 取源码）
      - name: Checkout source for packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare (changelog + pack 8 platforms)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/release.py prepare --kind tool --channel "$CHANNEL" --version "$VERSION_NAME" --version-code "$VERSION_CODE"

      - name: Upload to OpenList (signed version.json)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          OPENLIST_STORAGE_DIR: ${{ secrets.SERVER_OPENLIST_DIR }}
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          ARTIFACT_DIR: output
        run: python3 ci/release.py upload --channel "$CHANNEL" --version "$VERSION_NAME" --version-code "$VERSION_CODE" --artifact-dir output

      - name: Tag the release commit (auto stable only)
        if: env.CHANNEL == 'stable' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ env.VERSION_NAME }}
        run: |
          set -Eeuo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "tag $TAG_NAME 已存在，跳过"
            exit 0
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG_NAME" -f sha="$GITHUB_SHA"

      - name: Create GitHub Release (stable only)
        if: env.CHANNEL == 'stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release create "$VERSION_NAME" output/*.zip \
            --title "$VERSION_NAME" --notes-file release.md --verify-tag
          gh release edit "$VERSION_NAME" --latest
