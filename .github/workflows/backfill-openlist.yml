name: backfill-openlist

# 灾备/修复：把**已存在的 GitHub Release 产物**补传到 OpenList。
# 常规发版走 release.yml（beta=push / stable=tag）；本 workflow 只处理
# 「Release 早已存在、但 OpenList 缺失或损坏」与「需要重传」——不重新构建，只搬运。
#
# 幂等：重复执行覆盖同名版本目录；归档保留（beta 2 / stable 3）照常执行；
# version.json 的 commit / publishedAt 沿用服务器已有值，不污染 changelog 基准与发布时间。
# 产物名必须符合当前规范（8 个平台词形，见 naming-conventions.md）；改名前的旧产物名
# （带 `-release` 构建类型后缀）会被 release.py 明确拒绝，需先在 Release 里重命名资产。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '要回填的版本（= Release tag，如 1.0.2.0）'
        required: true
      channel:
        description: '通道'
        required: true
        default: 'stable'
        type: choice
        options: [stable, beta]

permissions:
  contents: read

concurrency:
  group: backfill-${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 下载 Release 产物
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p output
          gh release download "$VERSION" -R "$GITHUB_REPOSITORY" --dir output -p '*.apk' -p '*.zip'
          ls -la output/
          # 复用 Release 正文作为 OpenList 各级 README（与发版时逐字一致）
          gh release view "$VERSION" -R "$GITHUB_REPOSITORY" --json body --jq .body > release.md
          echo "===== release.md ====="; cat release.md

      - name: Deploy to OpenList
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          OPENLIST_STORAGE_DIR: ${{ secrets.SERVER_OPENLIST_DIR }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          args=(upload --channel "$CHANNEL" --version "$VERSION" --artifact-dir output)
          commit=$(git rev-parse -q --verify "$VERSION^{commit}" || true)
          [ -n "$commit" ] && args+=(--commit "$commit")
          python3 ci/release.py "${args[@]}"
